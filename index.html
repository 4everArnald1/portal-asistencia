<!DOCTYPE html>
<html lang="es">


<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Sistema de control de asistencia - Módulo Fisiología</title>


<style>


*{
box-sizing:border-box;
}


body{


font-family:Arial,sans-serif;
text-align:center;
margin:0;
padding:10px;
background:#eef2f5;


}




.contenedor{


width:100%;
max-width:700px;
min-height:100vh;
margin:auto;
background:white;
border-radius:20px;
padding:25px 15px;
box-shadow:0 4px 15px rgba(0,0,0,0.18);


}




h1{


font-size:32px;


}




h2{


font-size:28px;


}




h3{


font-size:24px;


}






input{


width:95%;
max-width:400px;
font-size:24px;
padding:16px;
margin:10px;
text-align:center;
border-radius:15px;
border:2px solid #888;


}






button{


width:95%;
max-width:400px;
font-size:22px;
font-weight:bold;
padding:18px;
margin:12px;
border-radius:15px;
border:none;
background:#1976d2;
color:white;


}






button:hover{


opacity:0.85;


}






#menu{


display:none;


}






#mensajeLogin{


font-size:22px;
font-weight:bold;
margin-top:20px;


}






.secundario{


background:#555;


}




</style>




</head>




<body>




<div class="contenedor">






<!-- LOGIN -->


<div id="login">




<h1>
🧬 Sistema de control de asistencia
</h1>




<h2>
Módulo Fisiología
</h2>




<h3>
🔐 Acceso docente
</h3>






<input
id="usuario"
placeholder="Usuario">






<br>






<input
id="clave"
type="password"
placeholder="Clave">






<br>






<button onclick="mostrarClave()">


👁 Mostrar / ocultar clave


</button>






<button onclick="ingresar()">


Ingresar


</button>






<div id="mensajeLogin"></div>




</div>










<!-- MENU -->


<div id="menu">




<h1>
🧬 Sistema de control de asistencia
</h1>




<h2>
Módulo Fisiología
</h2>






<button onclick="abrirAsistencia()">


📷 Control de asistencia


</button>






<button onclick="abrirPanel()">


📊 Panel de control


</button>






<button onclick="abrirConsulta()">


👨‍🎓 Consulta estudiante


</button>








<button class="secundario" onclick="cerrarSesion()">


🚪 Cerrar sesión


</button>






</div>






</div>










<script>




const usuarioCorrecto = "docentes";


const claveCorrecta = "fisio2026";










function ingresar(){




let usuario =
document.getElementById("usuario")
.value
.toLowerCase()
.trim();






let clave =
document.getElementById("clave")
.value
.trim();










if(
usuario === usuarioCorrecto &&
clave === claveCorrecta
){




localStorage.setItem(
"accesoPortal",
"ok"
);






mostrarMenu();






}else{




document.getElementById("mensajeLogin")
.innerHTML =
"❌ Usuario o clave incorrectos";




}




}










function verificarSesion(){




if(
localStorage.getItem("accesoPortal") === "ok"
){




mostrarMenu();




}




}














function mostrarMenu(){




document.getElementById("login")
.style.display="none";




document.getElementById("menu")
.style.display="block";




}














function mostrarClave(){




let campo =
document.getElementById("clave");






if(
campo.type==="password"
){




campo.type="text";




}else{




campo.type="password";




}




}














function cerrarSesion(){




localStorage.removeItem(
"accesoPortal"
);






location.reload();




}














function abrirAsistencia(){




window.open(
"https://4everarnald1.github.io/lector-qr-asistencia/",
"_blank"
);




}












function abrirPanel(){




window.open(
"https://script.google.com/a/macros/fmed.uba.ar/s/AKfycbzIN4VZi1At1ZzXq1rh4r5aeXMaQkaIMTHb8PQ12EQFXlOsq1zwt5yHe_Kvo78m6w8D/exec?admin=1",
"_blank"
);




}














function abrirConsulta(){




window.open(
"https://script.google.com/a/macros/fmed.uba.ar/s/AKfycbzIN4VZi1At1ZzXq1rh4r5aeXMaQkaIMTHb8PQ12EQFXlOsq1zwt5yHe_Kvo78m6w8D/exec?consulta=1",
"_blank"
);




}










verificarSesion();






</script>




</body>


</html>
